# B744 ND route plugin settings (re-read every 2 seconds while the sim runs)
enable 1
# debug 1: cyan cross at the aircraft position and a cyan full-range circle (for alignment)
debug 0
# panel position of the aircraft symbol in expanded MAP (captain / first officer ND)
capt_x 335
capt_y 165
fo_x 1022
fo_y 165
# shift of the aircraft symbol in centred MAP
center_dy 173.5
# panel pixels for the selected range
px_full 458
# clip radius (px) expanded / centred
line_w 2
draw_capt 1
draw_fo 1
# ND screen rectangle (panel px) around the expanded-MAP aircraft position: nothing is drawn outside it
scr_half_w 327
scr_below 135
scr_above 520
# symbols (1 = shown)
show_wpt 1
show_tctd 1
show_arc 1
show_trend 1
# text height and waypoint star radius (panel px)
font_h 13
sym_r 11
# T/C, T/D circle radius and text height (panel px)
tctd_r 6.5
tctd_font_h 13
# CUSTOM ND: 1 = this plugin draws the whole captain ND (and the first officer ND with draw_fo 1) (X-Plane's map and the stock ND icons are hidden)
#            0 = stock ND (X-Plane's map and icons), nothing drawn by this plugin
custom_nd 1
# navaids / airports / fixes (EFIS STA, ARPT, WPT): symbol radius, text height, maximum shown per kind
nav_r 6
nav_font_h 11
max_nav 60
# 1 = shown
show_nav 1
show_rwy 1
show_tcas 1
show_wx 1
show_terr 1
# weather radar sensitivity (1 = normal)
wx_gain 1.0
